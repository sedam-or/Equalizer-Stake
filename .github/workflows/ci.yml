# CI for every PR and push to main (spec/12 §3, spec/24 OSS-20/21).
# Jobs activate progressively: each one skips until the code it checks exists,
# and `ci-ok` is the single required status check for branch protection.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SQLX_OFFLINE: "true"

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      web: ${{ steps.d.outputs.web }}
      openapi: ${{ steps.d.outputs.openapi }}
      e2e: ${{ steps.d.outputs.e2e }}
      guards: ${{ steps.d.outputs.guards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: d
        name: Detect which parts of the repo exist
        run: |
          has() { if [ -e "$1" ]; then echo true; else echo false; fi; }
          {
            echo "rust=$(has Cargo.toml)"
            echo "web=$(has web/package.json)"
            if [ -f Cargo.toml ] && [ -f web/openapi.json ]; then echo "openapi=true"; else echo "openapi=false"; fi
            if [ -d web/e2e ] && [ -f Cargo.toml ]; then echo "e2e=true"; else echo "e2e=false"; fi
            if ls scripts/check-*.sh >/dev/null 2>&1; then echo "guards=true"; else echo "guards=false"; fi
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  docs:
    name: docs (task index, spelling, links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Task index is current and depends_on is a DAG (WORKFLOW.md)
        run: scripts/tasks-index.sh --check
      - name: ERD is current and migrations match the spec 06 DDL (ERD-03)
        run: scripts/erd.py --check && scripts/erd.py --migrations
      - name: Spelling
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - name: Local Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

  meta:
    name: meta (workflow lint and security)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          persona: regular

  pr-title:
    name: pr-title (COMMIT_CONVENTION §9)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|test|docs|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [A-Za-z0-9].{0,70}$'
          if [ "${#TITLE}" -gt 72 ]; then echo "::error::PR title is longer than 72 characters"; exit 1; fi
          if ! printf '%s' "$TITLE" | grep -Eq "$re"; then
            echo "::error::PR title must follow COMMIT_CONVENTION.md, e.g. 'docs(spec): add validation standard [#12]'"
            exit 1
          fi

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          range=""
          if [ -n "$BASE_SHA" ]; then range="--log-opts=${BASE_SHA}..${HEAD_SHA}"; fi
          config=""
          if [ -f .gitleaks.toml ]; then config="--config=/repo/.gitleaks.toml"; fi
          # shellcheck disable=SC2086 # optional flags are intentionally word-split
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --exit-code 1 $config $range /repo

  rust:
    name: rust (fmt, clippy, deny, tests, coverage)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-machete,cargo-audit
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo deny check
      - run: cargo audit
      - run: cargo machete
      - name: Tests with coverage (testcontainers uses the runner's Docker)
        run: cargo llvm-cov nextest --workspace --locked --lcov --output-path lcov.info
      - name: Domain coverage gate (TST-01)
        run: |
          if [ -x scripts/check-coverage.sh ]; then scripts/check-coverage.sh lcov.info
          else echo "scripts/check-coverage.sh not present yet (T-006); skipping gate"; fi

  web:
    name: web (lint, types, tests, i18n, size, build)
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web audit --prod
      - run: pnpm -C web run --if-present lint
      - run: pnpm -C web run --if-present typecheck
      - run: pnpm -C web run --if-present test
      - run: pnpm -C web run --if-present i18n:check
      - run: pnpm -C web run --if-present knip
      - run: pnpm -C web run --if-present build
      - run: pnpm -C web run --if-present size

  contract:
    name: contract (OpenAPI drift, API fuzzing)
    needs: detect
    if: needs.detect.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: OpenAPI and generated client match the code (TST-10)
        run: |
          cargo run --locked -q -p eq-server -- openapi > web/openapi.json
          pnpm -C web install --frozen-lockfile
          pnpm -C web exec biome format --write openapi.json
          pnpm -C web run gen:api
          git diff --exit-code -- web/openapi.json web/src/api
      - name: Property-based API fuzzing (TST-18)
        run: |
          if [ -x scripts/ci/api-fuzz.sh ]; then scripts/ci/api-fuzz.sh
          else echo "scripts/ci/api-fuzz.sh not present yet (T-116a); skipping"; fi

  guards:
    name: guard scripts
    needs: detect
    if: needs.detect.outputs.guards == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run every guard script that exists
        run: |
          for s in scripts/check-deps.sh scripts/check-literals.sh scripts/check-web-boundaries.sh scripts/check-layers.sh; do
            if [ -x "$s" ]; then echo "::group::$s"; "$s"; echo "::endgroup::"; fi
          done
          if ls scripts/tests/*.sh >/dev/null 2>&1; then for t in scripts/tests/*.sh; do bash "$t"; done; fi

  e2e:
    name: e2e (Playwright)
    needs: [detect, rust, web]
    if: needs.detect.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eq
          POSTGRES_PASSWORD: eq
          POSTGRES_DB: ritma
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U eq -d ritma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://eq_app:eq_app@localhost:5433/ritma
      RITMA_DATABASE_OWNER_URL: postgres://eq:eq@localhost:5433/ritma
      RITMA_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RITMA_PUBLIC_URL: http://localhost:8080
      RITMA_LISTEN: 127.0.0.1:8080
      RITMA_DATA_DIR: /tmp/ritma-e2e
      RITMA_BACKUP_SCHEDULE: off
      E2E_BASE_URL: http://127.0.0.1:8080
      E2E_SKIP_DB_START: "1"
      E2E_PLAYWRIGHT_CONTAINER: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web exec playwright install --with-deps chromium webkit
      - name: Create the least-privilege application role
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: >-
          docker exec "$POSTGRES_CONTAINER_ID" psql -U eq -d ritma
          -v ON_ERROR_STOP=1
          -c "CREATE ROLE eq_app LOGIN PASSWORD 'eq_app' NOSUPERUSER NOBYPASSRLS"
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  ci-ok:
    name: ci-ok
    if: always()
    needs: [detect, docs, meta, pr-title, secrets, rust, web, contract, guards, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job that ran failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) echo "::error::a required job did not pass"; exit 1;; esac
          done
