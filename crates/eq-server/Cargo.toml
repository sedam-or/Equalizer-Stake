[package]
name = "eq-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ritma"
path = "src/main.rs"

[features]
default = ["enrollment", "billing", "attendance", "rental", "notify", "reports", "feedback"]
enrollment = ["eq-api/enrollment"]
billing = ["eq-api/billing"]
attendance = ["eq-api/attendance"]
rental = ["eq-api/rental"]
notify = ["eq-api/notify"]
reports = ["eq-api/reports"]
feedback = ["eq-api/feedback"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
eq-api = { workspace = true, default-features = false }
eq-core.workspace = true
reqwest.workspace = true
secrecy.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
sqlx.workspace = true
testcontainers.workspace = true

[lints]
workspace = true
