version: "3.8"

services:
  app:
    build: .
    container_name: eqs-app
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - APP_ENV=development
      - APP_DEBUG=true
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=equalizer_stake
      - POSTGRES_USER=eqs
      - POSTGRES_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - equalizer-net
    restart: unless-stopped

  worker:
    build: .
    container_name: eqs-worker
    command: ["/app/bin/worker"]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=equalizer_stake
      - POSTGRES_USER=eqs
      - POSTGRES_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - equalizer-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: eqs-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=equalizer_stake
      - POSTGRES_USER=eqs
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eqs -d equalizer_stake"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - equalizer-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: eqs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - equalizer-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  equalizer-net:
    driver: bridge
