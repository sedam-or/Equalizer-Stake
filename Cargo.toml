[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/sedam-or/Equalizer-Stake"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "compression-full", "limit", "cors", "set-header", "util"] }
tower_governor = "0.7"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
ipnet = { version = "2", features = ["serde"] }
figment = { version = "0.10", features = ["env"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
schemars = { version = "1", features = ["chrono04", "uuid1"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2"
jsonschema = "0.30"
json-patch = "4"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
cron = "0.15"
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
jsonwebtoken = "9"
argon2 = "0.5"
aes-gcm = "0.10"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
secrecy = "0.10"
base64 = "0.22"
rust-embed = { version = "8", features = ["mime-guess"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
minijinja = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
infer = "0.16"
dashmap = "6"
moka = { version = "0.12", features = ["future"] }
proptest = "1"
insta = { version = "1", features = ["json", "yaml"] }
testcontainers = "0.28"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
axum-test = "17"
serde_jcs = "0.1"
phonenumber = "0.3"

eq-core = { path = "crates/eq-core" }
eq-audit = { path = "crates/eq-audit" }
eq-identity = { path = "crates/eq-identity" }
eq-scheduling = { path = "crates/eq-scheduling" }
eq-enrollment = { path = "crates/eq-enrollment" }
eq-billing = { path = "crates/eq-billing" }
eq-attendance = { path = "crates/eq-attendance" }
eq-rental = { path = "crates/eq-rental" }
eq-notify = { path = "crates/eq-notify" }
eq-reports = { path = "crates/eq-reports" }
eq-feedback = { path = "crates/eq-feedback" }
eq-api = { path = "crates/eq-api" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
too_many_lines = "warn"
semicolon_if_nothing_returned = "warn"
redundant_else = "warn"
manual_let_else = "warn"
explicit_iter_loop = "warn"
